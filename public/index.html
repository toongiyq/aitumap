<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="aitu map"
      content="map of Astana IT University"
    />
    <title>aitu map</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
    (function () {
      // 1) Rooms drawn as polyline/polygon (data-name).
      var ROOMS = [
        "C1.2.123K",
        "C1.2.124K",
        "C1.2.138L",
        "C1.2.139",
        "ASSEMBLYHALL|АКТОВЫЙ ЗАЛ"
      ];
    
      // 2) Groups painted as a whole rectangle, with an optional white label.
      var BOXES = [
        { name: "ATAMEKEN|АТАМЕКЕН", lines: ["ATAMEKEN", "SPACE"] }
      ];
    
      // Optional: extra rooms from the link, e.g. ?rooms=C1.2.125K
      var extra = new URLSearchParams(location.search).get("rooms");
      if (extra) ROOMS = ROOMS.concat(extra.split(","));
    
      var NS = "http://www.w3.org/2000/svg";
      var style = "{fill:#ffd54f !important;stroke:#e65100 !important;stroke-width:3 !important;}";
      var css = "";
      function clean(v) { return String(v).trim().replace(/["\\]/g, ""); }
    
      ROOMS.forEach(function (r) {
        r = clean(r);
        if (!r) return;
        var s = '[data-name="' + r + '"]';
        css += s + " polyline," + s + " polygon," + "polyline" + s + "," + "polygon" + s + style;
      });
    
      // Inner decorative lines of a boxed group: no fill, thin orange line
      BOXES.forEach(function (b) {
        css += '[data-name="' + clean(b.name) + '"] path{fill:none !important;stroke:#e65100 !important;stroke-width:1.5 !important;}';
      });
    
      var st = document.createElement("style");
      st.textContent = css;
      document.head.appendChild(st);
    
      function drawBoxes() {
        BOXES.forEach(function (box) {
          document.querySelectorAll('[data-name="' + clean(box.name) + '"]').forEach(function (g) {
            if (g.getAttribute("data-hl") || !g.getBBox) return;
            var bb;
            try { bb = g.getBBox(); } catch (e) { return; }
            if (!bb.width || !bb.height) return;
    
            // rectangle behind the group's content
            var r = document.createElementNS(NS, "rect");
            r.setAttribute("x", bb.x);
            r.setAttribute("y", bb.y);
            r.setAttribute("width", bb.width);
            r.setAttribute("height", bb.height);
            r.setAttribute("rx", 3);
            r.setAttribute("style", "fill:#ffd54f;stroke:#e65100;stroke-width:3;pointer-events:none");
            g.insertBefore(r, g.firstChild);
    
            // white label on top
            if (box.lines && box.lines.length) {
              var cx = bb.x + bb.width / 2;
              var fs = bb.width * 0.14;          // font size: change 0.14 to make text bigger/smaller
              var lh = fs * 1.15;
              var y0 = bb.y + bb.height / 2 - (box.lines.length - 1) * lh / 2 + fs * 0.35;
              var t = document.createElementNS(NS, "text");
              t.setAttribute("text-anchor", "middle");
              t.setAttribute("style",
                "fill:#fff !important;" +
                "font-family:Inter,'Segoe UI',system-ui,-apple-system,sans-serif;" +
                "font-weight:600;letter-spacing:0.5px;font-size:" + fs + "px;" +
                "pointer-events:none;user-select:none");
              box.lines.forEach(function (line, i) {
                var ts = document.createElementNS(NS, "tspan");
                ts.setAttribute("x", cx);
                ts.setAttribute("y", y0 + i * lh);
                ts.textContent = line;
                t.appendChild(ts);
              });
              g.appendChild(t);
            }
    
            g.setAttribute("data-hl", "1");
          });
        });
      }
      new MutationObserver(drawBoxes).observe(document.documentElement, { childList: true, subtree: true });
      drawBoxes();
      setInterval(drawBoxes, 700);
    })();
    </script>
  </body>
</html>
