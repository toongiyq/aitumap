<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="aitu map"
      content="map of Astana IT University"
    />
    <title>aitu map</title>
  </head>
  <body>
    <div id="root"></div>

    <script>
    (function () {
      var p = new URLSearchParams(location.search).get("rooms");
      if (!p) return;
      var css = p.split(",").map(function (r) {
        r = r.trim().replace(/["\\]/g, "");
        if (!r) return "";
        var s = '[data-name="' + r + '"]';
        return s + " polyline," + s + " polygon," + "polyline" + s + "," + "polygon" + s +
          "{fill:#ffd54f !important;stroke:#e65100 !important;stroke-width:3 !important;}";
      }).join("");
      var st = document.createElement("style");
      st.textContent = css;
      document.head.appendChild(st);
    })();
    </script>
  </body>
</html>
